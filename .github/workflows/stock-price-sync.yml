name: 📈 Stock Price Sync Daily

on:
  schedule:
    # 台股收盤 13:30 + 緩衝，抓 14:30 UTC+8 = 06:30 UTC
    - cron: "30 6 * * 1-5"
  workflow_dispatch: # 支援手動觸發

jobs:
  sync:
    name: Run stock-price-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/stock-price-sync

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: 📈 Run stock price sync
        run: uv run --with "finlab>=1.5.9" python main.py
        env:
          FINLAB_API_TOKEN: ${{ secrets.FINLAB_API_TOKEN }}
          KANG_CORE_API_BASE_URL: ${{ secrets.KANG_CORE_API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
