# Threads Scraper 排程設定檔

# ── 追蹤設定 ──────────────────────────────────────────────

# 追蹤特定用戶的最新貼文 - 台股優先
# 原 AI/科技清單已移除（範圍調整為台股），實際帳號請自行在 Threads 上確認後
# 透過 /threads Dashboard 或 LINE Bot「/追蹤 @帳號」新增（會與此清單合併）
users: []

# 追蹤特定貼文的新回覆
threads:
  # - url: "https://www.threads.net/t/XXXXX"
  #   check_replies: true

# 關鍵字搜尋 - 台股優先
keywords:
  # 大盤與指數
  - "台股"
  - "大盤"
  - "加權指數"
  - "台指期"
  - "櫃買"

  # 法人與資金動向
  - "外資"
  - "投信"
  - "自營商"
  - "三大法人"
  - "融資"
  - "融券"

  # 個股與族群
  - "個股"
  - "權值股"
  - "半導體"
  - "AI股"
  - "ETF"
  - "0050"
  - "00919"
  - "台積電"
  - "存股"

  # 財報與基本面
  - "財報"
  - "營收"
  - "殖利率"
  - "本益比"
  - "除權息"

  # 交易與策略
  - "選股"
  - "當沖"
  - "波段"
  - "技術分析"

# ── 探索模式 ──────────────────────────────────────────────
# 自動搜尋新的貼文（不限於追蹤的用戶）

explore:
  # 是否啟用探索模式（關閉，因為內容太雜亂）
  enabled: false

  # 每次向下滾動次數（每次約 10-15 篇貼文）
  max_scrolls: 5

  # 說明：
  # - 抓取 Threads 探索頁面的熱門/推薦貼文
  # - 會自動過濾關鍵字
  # - 高互動貼文的作者會被自動發現並追蹤

# ── 排程設定 ──────────────────────────────────────────────

schedule:
  # 每日執行時間（24小時制）
  daily_at: "09:00"

  # 或者使用 cron 表達式（進階用法）
  # cron: "0 9 * * *"  # 每天早上 9:00

# ── 資料庫設定 ──────────────────────────────────────────────

database:
  path: "threads_data.db"

# ── 通知設定 ──────────────────────────────────────────────

notifications:
  enabled: true  # 已整合 Kang-Core Webhook Bridge

  # Webhook 設定
  webhooks:
    # ── Kang-Core Next.js 整合 ────────────────────────────────────────────────
    # 本地開發時使用 localhost，部署後換成正式網域
    - url: "http://localhost:3000/api/webhooks/threads"
      type: "generic"
      name: "Kang-Core 本地"

    # 正式環境（在 Vercel 部署後取消此行的 # 並填入你的網址）
    # - url: "https://YOUR_DOMAIN.vercel.app/api/webhooks/threads"
    #   type: "generic"
    #   name: "Kang-Core Production"

    # ── 其他通知平台（選填）─────────────────────────────────────────────────
    # Discord Webhook
    # - url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    #   type: "discord"
    #   name: "Threads Discord"

    # LINE Notify（與 Kang-Core LINE Bot 並行，可選擇擇一）
    # - url: "YOUR_LINE_NOTIFY_TOKEN"
    #   type: "line"
    #   name: "Threads LINE Notify"

  # 通知條件
  notify_on:
    new_posts: true      # 新貼文
    new_replies: true    # 新回覆
    keyword_match: true  # 關鍵字配對

# ── 自動發現設定 ──────────────────────────────────────────────

discovery:
  # 是否啟用自動發現優質發文者（Demo：現在開啟）
  enabled: true

  # 發現條件
  min_like_count: 50         # 最低平均按讚數（Demo 降低門檻）
  min_reply_count: 5         # 最低平均回覆數
  min_posts: 2               # 最少貼文數量

  # 每次最多自動追蹤幾個新用戶
  max_new_users_per_run: 3

  # 是否自動加入追蹤（若為 false，只會列出但不會自動追蹤）
  auto_track: true

  # 清理不活躍用戶（超過 N 天未抓取）
  cleanup_inactive_days: 60

# ── 進階設定 ──────────────────────────────────────────────

advanced:
  # 是否顯示瀏覽器視窗（除錯用）
  headless: true

  # 抓取間隔設定（避免被當作機器人）
  delay_between_requests: 5      # 基本延遲（秒）
  random_delay: true              # 啟用隨機延遲（更像人類）
  random_delay_min: 3             # 隨機延遲最小值（秒）
  random_delay_max: 10            # 隨機延遲最大值（秒）

  # 錯誤處理
  max_retries: 3                  # 失敗重試次數
  retry_delay: 30                 # 重試間隔（秒）

  # 請求限制（每小時最多抓取幾個用戶）
  max_requests_per_hour: 20

  # 去重時間範圍（天），超過此時間的貼文不會重複通知
  dedup_days: 7
