<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>離線中 — 康 Core</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            padding: 24px;
        }
        h1 { font-size: 1.25rem; margin: 0; }
        p { color: #a3a3a3; font-size: 0.9rem; margin: 0; }
        button {
            margin-top: 16px;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #6366f1;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📡 目前離線</h1>
    <p>網路連線中斷，記帳、查詢等功能需要連線才能使用</p>

    <button onclick="location.reload()">重新連線</button>

</html>
